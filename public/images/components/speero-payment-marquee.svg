<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="100%" stop-color="#071220"/>
    </linearGradient>
  </defs>
  
  <rect width="500" height="200" rx="16" fill="url(#bgGrad3)"/>
  <rect x="1" y="1" width="498" height="198" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title -->
  <g transform="translate(20, 20)">
    <circle cx="10" cy="10" r="4" fill="#f59e0b"/>
    <text x="22" y="14" fill="#f59e0b" font-family="'Cairo', sans-serif" font-size="12" font-weight="800">طرق دفع آمنة 100% وتقسيط ميسر بدون فوائد</text>
  </g>

  <!-- Continuous Payment Badges Row -->
  <g transform="translate(20, 55)">
    <!-- Mada -->
    <g transform="translate(0, 0)">
      <rect width="70" height="80" rx="10" fill="#0f2847" stroke="#334155" stroke-width="1"/>
      <circle cx="35" cy="30" r="14" fill="#00843D" opacity="0.8"/>
      <text x="35" y="65" fill="#e2e8f0" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" text-anchor="middle">مدى Mada</text>
    </g>

    <!-- Apple Pay -->
    <g transform="translate(78, 0)">
      <rect width="70" height="80" rx="10" fill="#0f2847" stroke="#334155" stroke-width="1"/>
      <circle cx="35" cy="30" r="14" fill="#000000" opacity="0.9"/>
      <text x="35" y="65" fill="#e2e8f0" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Apple Pay</text>
    </g>

    <!-- Tabby -->
    <g transform="translate(156, 0)">
      <rect width="70" height="80" rx="10" fill="#0f2847" stroke="#334155" stroke-width="1"/>
      <rect x="21" y="20" width="28" height="20" rx="4" fill="#29E8B2"/>
      <text x="35" y="65" fill="#e2e8f0" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" text-anchor="middle">تابي Tabby</text>
    </g>

    <!-- Tamara -->
    <g transform="translate(234, 0)">
      <rect width="70" height="80" rx="10" fill="#0f2847" stroke="#334155" stroke-width="1"/>
      <rect x="21" y="20" width="28" height="20" rx="4" fill="#FF9100"/>
      <text x="35" y="65" fill="#e2e8f0" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" text-anchor="middle">تمارا Tamara</text>
    </g>

    <!-- Visa -->
    <g transform="translate(312, 0)">
      <rect width="70" height="80" rx="10" fill="#0f2847" stroke="#334155" stroke-width="1"/>
      <rect x="21" y="20" width="28" height="20" rx="4" fill="#1A1F71"/>
      <text x="35" y="65" fill="#e2e8f0" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" text-anchor="middle">فيزا Visa</text>
    </g>

    <!-- Mastercard -->
    <g transform="translate(390, 0)">
      <rect width="70" height="80" rx="10" fill="#0f2847" stroke="#334155" stroke-width="1"/>
      <circle cx="30" cy="30" r="10" fill="#EB001B" opacity="0.9"/>
      <circle cx="40" cy="30" r="10" fill="#F79E1B" opacity="0.85"/>
      <text x="35" y="65" fill="#e2e8f0" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ماستركارد</text>
    </g>
  </g>
</svg>