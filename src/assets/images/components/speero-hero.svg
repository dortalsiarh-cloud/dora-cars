<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061527"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="250" fill="url(#heroBg)"/>
  
  <!-- Header Text -->
  <rect x="20" y="24" width="130" height="18" rx="3" fill="#e41f37" fill-opacity="0.2"/>
  <text x="85" y="36" fill="#e41f37" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">منصة قطع الغيار الأسرع</text>
  
  <text x="20" y="68" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="900">كل ما تحتاجه لسيارتك</text>
  <text x="20" y="88" fill="#fbbf24" font-size="14" font-family="sans-serif" font-weight="bold">في مكان واحد وبضمان التوافق</text>
  <text x="20" y="108" fill="#94a3b8" font-size="9" font-family="sans-serif">ابحث برقم الهيكل أو الموديل وتصفح آلاف القطع المعتمدة</text>

  <!-- 3-Tab Search Box (Right/Center) -->
  <g transform="translate(20, 125)">
    <rect width="360" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Tabs Header -->
    <rect x="10" y="8" width="85" height="20" rx="3" fill="#0b2545" fill-opacity="0.08"/>
    <text x="52" y="21" fill="#0b2545" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">🚗 اختر سيارتك</text>
    
    <rect x="100" y="8" width="85" height="20" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="142" y="21" fill="#64748b" font-size="8" font-family="sans-serif" text-anchor="middle">🔢 رقم الهيكل VIN</text>
    
    <rect x="190" y="8" width="85" height="20" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="232" y="21" fill="#64748b" font-size="8" font-family="sans-serif" text-anchor="middle">🔍 رقم القطعة OEM</text>

    <!-- Dropdown selectors mock -->
    <rect x="10" y="36" width="78" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="52" fill="#0f172a" font-size="8" font-family="sans-serif">الماركة: تويوتا</text>

    <rect x="94" y="36" width="78" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="102" y="52" fill="#0f172a" font-size="8" font-family="sans-serif">الموديل: كامري</text>

    <rect x="178" y="36" width="55" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="186" y="52" fill="#0f172a" font-size="8" font-family="sans-serif">2024</text>

    <rect x="239" y="36" width="111" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="247" y="52" fill="#0f172a" font-size="8" font-family="sans-serif">قسم: كافة القطع</text>

    <!-- Search CTA Button -->
    <rect x="10" y="70" width="340" height="26" rx="3" fill="#e41f37"/>
    <text x="180" y="86" fill="#ffffff" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">🔍 عرض كافة قطع الغيار المتوافقة مع سيارتك</text>
  </g>
</svg>
