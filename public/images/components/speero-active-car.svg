<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <rect width="400" height="250" fill="#f8fafc"/>
  
  <text x="200" y="50" fill="#0b2545" font-size="13" font-family="sans-serif" font-weight="800" text-anchor="middle">شريط السيارة المحددة الذكي</text>
  <text x="200" y="68" fill="#64748b" font-size="8.5" font-family="sans-serif" text-anchor="middle">يظهر أعلى المتجر لتذكير العميل بسيارته المحفوظة وتصفية القطع لها</text>

  <!-- Active Bar Card -->
  <g transform="translate(20, 100)">
    <rect width="360" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Green Check Icon -->
    <rect x="12" y="10" width="30" height="30" rx="3" fill="#10b981" fill-opacity="0.12"/>
    <text x="27" y="30" font-size="16" text-anchor="middle">🚗</text>

    <!-- Text -->
    <text x="52" y="24" fill="#64748b" font-size="7.5" font-family="sans-serif">أنت تتصفح قطع الغيار المتوافقة مع:</text>
    <text x="52" y="37" fill="#0b2545" font-size="10" font-family="sans-serif" font-weight="bold">تويوتا - كامري - 2024 (Toyota Camry)</text>

    <!-- Change Button -->
    <rect x="290" y="12" width="60" height="26" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="320" y="28" fill="#e41f37" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">تغيير السيارة</text>
  </g>
</svg>
