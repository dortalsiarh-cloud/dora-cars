<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061527"/>
      <stop offset="100%" stop-color="#0b1e36"/>
    </linearGradient>
  </defs>
  
  <rect width="500" height="280" rx="16" fill="url(#bgGrad4)"/>
  <rect x="1" y="1" width="498" height="278" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="250" y="38" fill="#f59e0b" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" text-anchor="middle">الماركات المعتمدة</text>
  <text x="250" y="62" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="17" font-weight="900" text-anchor="middle">تسوق قطع الغيار حسب ماركة سيارتك</text>

  <!-- Brands Grid -->
  <g transform="translate(35, 85)">
    <!-- Toyota -->
    <g transform="translate(0, 0)">
      <rect width="95" height="75" rx="10" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="47" cy="28" r="14" fill="#ef4444" opacity="0.2"/>
      <text x="47" y="32" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" text-anchor="middle">TOYOTA</text>
      <text x="47" y="58" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="9" text-anchor="middle">تويوتا</text>
    </g>

    <!-- Hyundai -->
    <g transform="translate(110, 0)">
      <rect width="95" height="75" rx="10" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="47" cy="28" r="14" fill="#3b82f6" opacity="0.2"/>
      <text x="47" y="32" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" text-anchor="middle">HYUNDAI</text>
      <text x="47" y="58" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="9" text-anchor="middle">هيونداي</text>
    </g>

    <!-- Kia -->
    <g transform="translate(220, 0)">
      <rect width="95" height="75" rx="10" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="47" cy="28" r="14" fill="#ef4444" opacity="0.2"/>
      <text x="47" y="32" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" text-anchor="middle">KIA</text>
      <text x="47" y="58" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="9" text-anchor="middle">كيا</text>
    </g>

    <!-- Nissan -->
    <g transform="translate(330, 0)">
      <rect width="95" height="75" rx="10" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="47" cy="28" r="14" fill="#f59e0b" opacity="0.2"/>
      <text x="47" y="32" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" text-anchor="middle">NISSAN</text>
      <text x="47" y="58" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="9" text-anchor="middle">نيسان</text>
    </g>

    <!-- Row 2: Ford, Geely, Changan, Chevrolet -->
    <g transform="translate(0, 85)">
      <rect width="95" height="75" rx="10" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <text x="47" y="32" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" text-anchor="middle">FORD</text>
      <text x="47" y="58" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="9" text-anchor="middle">فورد</text>
    </g>
    <g transform="translate(110, 85)">
      <rect width="95" height="75" rx="10" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <text x="47" y="32" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" text-anchor="middle">GEELY</text>
      <text x="47" y="58" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="9" text-anchor="middle">جيلي</text>
    </g>
    <g transform="translate(220, 85)">
      <rect width="95" height="75" rx="10" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <text x="47" y="32" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" text-anchor="middle">CHANGAN</text>
      <text x="47" y="58" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="9" text-anchor="middle">شانجان</text>
    </g>
    <g transform="translate(330, 85)">
      <rect width="95" height="75" rx="10" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <text x="47" y="32" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" text-anchor="middle">CHEVY</text>
      <text x="47" y="58" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="9" text-anchor="middle">شيفروليه</text>
    </g>
  </g>
</svg>