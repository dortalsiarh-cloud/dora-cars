<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <rect width="400" height="250" fill="#f8fafc"/>
  
  <!-- Header Bar -->
  <rect x="140" y="15" width="120" height="16" rx="3" fill="#e41f37" fill-opacity="0.08" stroke="#e41f37" stroke-opacity="0.2" stroke-width="1"/>
  <text x="200" y="26" fill="#e41f37" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">أقسام قطع الغيار</text>
  
  <text x="200" y="48" fill="#0b2545" font-size="12" font-family="sans-serif" font-weight="800" text-anchor="middle">تصفح حسب قسم القطعة</text>

  <!-- Categories Grid -->
  <g transform="translate(20, 62)">
    <!-- Cat 1: Filters -->
    <rect x="0" y="0" width="170" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="8" y="7" width="24" height="24" rx="3" fill="#0b2545" fill-opacity="0.06"/>
    <text x="20" y="23" font-size="12" text-anchor="middle">🌪️</text>
    <text x="40" y="20" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold">الفلاتر والمنقيات</text>
    <text x="40" y="29" fill="#64748b" font-size="6.5" font-family="sans-serif">فلاتر زيت، هواء، ومكيف</text>

    <!-- Cat 2: Brakes -->
    <rect x="190" y="0" width="170" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="198" y="7" width="24" height="24" rx="3" fill="#0b2545" fill-opacity="0.06"/>
    <text x="210" y="23" font-size="12" text-anchor="middle">🛑</text>
    <text x="230" y="20" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold">الفرامل والمكابح</text>
    <text x="230" y="29" fill="#64748b" font-size="6.5" font-family="sans-serif">فحمات وهوبات وسوائل</text>

    <!-- Cat 3: Oils -->
    <rect x="0" y="44" width="170" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="8" y="51" width="24" height="24" rx="3" fill="#0b2545" fill-opacity="0.06"/>
    <text x="20" y="67" font-size="12" text-anchor="middle">🛢️</text>
    <text x="40" y="64" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold">الزيوت وسوائل التبريد</text>
    <text x="40" y="73" fill="#64748b" font-size="6.5" font-family="sans-serif">زيوت محرك وجيربوكس</text>

    <!-- Cat 4: Suspension -->
    <rect x="190" y="44" width="170" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="198" y="51" width="24" height="24" rx="3" fill="#0b2545" fill-opacity="0.06"/>
    <text x="210" y="67" font-size="12" text-anchor="middle">🚙</text>
    <text x="230" y="64" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold">المساعدات والتعليق</text>
    <text x="230" y="73" fill="#64748b" font-size="6.5" font-family="sans-serif">مساعدات ومقصات وجلود</text>

    <!-- Cat 5: Electrical -->
    <rect x="0" y="88" width="170" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="8" y="95" width="24" height="24" rx="3" fill="#0b2545" fill-opacity="0.06"/>
    <text x="20" y="111" font-size="12" text-anchor="middle">⚡</text>
    <text x="40" y="108" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold">الكهرباء والبواجي</text>
    <text x="40" y="117" fill="#64748b" font-size="6.5" font-family="sans-serif">بواجي، كويلات، وبطاريات</text>

    <!-- Cat 6: AC -->
    <rect x="190" y="88" width="170" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="198" y="95" width="24" height="24" rx="3" fill="#0b2545" fill-opacity="0.06"/>
    <text x="210" y="111" font-size="12" text-anchor="middle">❄️</text>
    <text x="230" y="108" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold">التكييف والتبريد</text>
    <text x="230" y="117" fill="#64748b" font-size="6.5" font-family="sans-serif">كمبروسر ورديتر مكيف</text>

    <!-- Cat 7: Lights -->
    <rect x="0" y="132" width="170" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="8" y="139" width="24" height="24" rx="3" fill="#0b2545" fill-opacity="0.06"/>
    <text x="20" y="155" font-size="12" text-anchor="middle">💡</text>
    <text x="40" y="152" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold">الإنارة والإضاءة</text>
    <text x="40" y="161" fill="#64748b" font-size="6.5" font-family="sans-serif">شمعات واصطبات وكشافات</text>

    <!-- Cat 8: Engine -->
    <rect x="190" y="132" width="170" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="198" y="139" width="24" height="24" rx="3" fill="#0b2545" fill-opacity="0.06"/>
    <text x="210" y="155" font-size="12" text-anchor="middle">⚙️</text>
    <text x="230" y="152" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold">المحرك والسيور</text>
    <text x="230" y="161" fill="#64748b" font-size="6.5" font-family="sans-serif">سيور مكينة وطرمبات ماء</text>
  </g>
</svg>
