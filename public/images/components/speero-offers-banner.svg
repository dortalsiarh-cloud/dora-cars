      <stop offset="0%" stop-color="#0f233a"/>
      <stop offset="100%" stop-color="#061527"/>
    </linearGradient>
  </defs>
  
  <rect width="500" height="200" rx="16" fill="url(#bgGrad6)"/>
  <rect x="1" y="1" width="498" height="198" rx="15" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Badge -->
  <g transform="translate(30, 26)">
    <rect width="130" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
