  <text x="30" y="105" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="11" font-weight="500">خصومات حصرية على باقات الزيوت والفلاتر والأقمشة بضمان التوافق 100%</text>

  <!-- CTA -->
