<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <rect width="400" height="250" fill="#ffffff"/>
  
  <!-- Header Bar -->
  <rect x="140" y="15" width="120" height="16" rx="3" fill="#e41f37" fill-opacity="0.08" stroke="#e41f37" stroke-opacity="0.2" stroke-width="1"/>
  <text x="200" y="26" fill="#e41f37" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">ماركات السيارات</text>
  
  <text x="200" y="48" fill="#0b2545" font-size="12" font-family="sans-serif" font-weight="800" text-anchor="middle">اختر الشركة المصنعة لسيارتك</text>
  
  <!-- Brands Grid (Logo on Top, Text Below) -->
  <g transform="translate(18, 62)">
    <!-- Brand 1: Toyota -->
    <rect x="0" y="0" width="82" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <ellipse cx="41" cy="28" rx="22" ry="14" fill="none" stroke="#D32F2F" stroke-width="2.5"/>
    <ellipse cx="41" cy="25" rx="10" ry="8" fill="none" stroke="#D32F2F" stroke-width="2"/>
    <text x="41" y="58" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Toyota</text>
    <text x="41" y="69" fill="#64748b" font-size="7" font-family="sans-serif" text-anchor="middle">تويوتا</text>

    <!-- Brand 2: Hyundai -->
    <rect x="94" y="0" width="82" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <ellipse cx="135" cy="28" rx="22" ry="14" fill="none" stroke="#002C6C" stroke-width="2.5"/>
    <text x="135" y="34" fill="#002C6C" font-size="16" font-family="sans-serif" font-weight="900" font-style="italic" text-anchor="middle">H</text>
    <text x="135" y="58" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Hyundai</text>
    <text x="135" y="69" fill="#64748b" font-size="7" font-family="sans-serif" text-anchor="middle">هيونداي</text>

    <!-- Brand 3: Kia -->
    <rect x="188" y="0" width="82" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="229" y="34" fill="#05141F" font-size="16" font-family="sans-serif" font-weight="900" letter-spacing="1" text-anchor="middle">KИ</text>
    <text x="229" y="58" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Kia</text>
    <text x="229" y="69" fill="#64748b" font-size="7" font-family="sans-serif" text-anchor="middle">كيا</text>

    <!-- Brand 4: Nissan -->
    <rect x="282" y="0" width="82" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="323" cy="28" r="14" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="306" y="24" width="34" height="8" fill="#64748b" rx="1"/>
    <text x="323" y="30" fill="#ffffff" font-size="5" font-family="sans-serif" font-weight="900" text-anchor="middle">NISSAN</text>
    <text x="323" y="58" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Nissan</text>
    <text x="323" y="69" fill="#64748b" font-size="7" font-family="sans-serif" text-anchor="middle">نيسان</text>

    <!-- Row 2 -->
    <!-- Brand 5: Ford -->
    <rect x="0" y="90" width="82" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <ellipse cx="41" cy="116" rx="22" ry="12" fill="#1C3F94"/>
    <text x="41" y="120" fill="#ffffff" font-size="12" font-family="Georgia, serif" font-weight="bold" font-style="italic" text-anchor="middle">Ford</text>
    <text x="41" y="148" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Ford</text>
    <text x="41" y="159" fill="#64748b" font-size="7" font-family="sans-serif" text-anchor="middle">فورد</text>

    <!-- Brand 6: Chevrolet -->
    <rect x="94" y="90" width="82" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M115 113H155V121H115Z" fill="#D4AF37"/>
    <path d="M127 106H143V128H127Z" fill="#D4AF37"/>
    <text x="135" y="148" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Chevrolet</text>
    <text x="135" y="159" fill="#64748b" font-size="7" font-family="sans-serif" text-anchor="middle">شيفروليه</text>

    <!-- Brand 7: Changan -->
    <rect x="188" y="90" width="82" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="229" cy="116" r="14" fill="#00457C"/>
    <path d="M222 112L229 122L236 112H231L229 116L227 112H222Z" fill="#FFFFFF"/>
    <text x="229" y="148" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Changan</text>
    <text x="229" y="159" fill="#64748b" font-size="7" font-family="sans-serif" text-anchor="middle">شانجان</text>

    <!-- Brand 8: Geely -->
    <rect x="282" y="90" width="82" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="307" y="106" width="32" height="20" rx="3" fill="#002F6C"/>
    <text x="323" y="120" fill="#ffffff" font-size="7" font-family="sans-serif" font-weight="900" text-anchor="middle">GEELY</text>
    <text x="323" y="148" fill="#0f172a" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Geely</text>
    <text x="323" y="159" fill="#64748b" font-size="7" font-family="sans-serif" text-anchor="middle">جيلي</text>
  </g>
</svg>
