<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <rect width="400" height="250" fill="#ffffff"/>
  
  <rect x="20" y="20" width="90" height="18" rx="3" fill="#e41f37" fill-opacity="0.08" stroke="#e41f37" stroke-opacity="0.2" stroke-width="1"/>
  <text x="65" y="32" fill="#e41f37" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">✨ وصل حديثاً</text>
  
  <text x="20" y="58" fill="#0b2545" font-size="13" font-family="sans-serif" font-weight="800">أحدث قطع الغيار المضافة</text>
  
  <!-- Product Cards Slider Row -->
  <g transform="translate(20, 75)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="112" height="150" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="10" y="10" width="92" height="70" rx="3" fill="#f8fafc"/>
    <text x="56" y="50" font-size="24" text-anchor="middle">⚙️</text>
    <text x="10" y="100" fill="#0f172a" font-size="8" font-family="sans-serif" font-weight="bold">فحمات فرامل سيراميك</text>
    <text x="10" y="112" fill="#64748b" font-size="7" font-family="sans-serif">تويوتا كامري</text>
    <text x="10" y="132" fill="#e41f37" font-size="10" font-family="sans-serif" font-weight="bold">185 ر.س</text>

    <!-- Card 2 -->
    <rect x="124" y="0" width="112" height="150" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="134" y="10" width="92" height="70" rx="3" fill="#f8fafc"/>
    <text x="180" y="50" font-size="24" text-anchor="middle">🛢️</text>
    <text x="134" y="100" fill="#0f172a" font-size="8" font-family="sans-serif" font-weight="bold">زيت محرك تخليقي 5W30</text>
    <text x="134" y="112" fill="#64748b" font-size="7" font-family="sans-serif">هيونداي / كيا</text>
    <text x="134" y="132" fill="#e41f37" font-size="10" font-family="sans-serif" font-weight="bold">45 ر.س</text>

    <!-- Card 3 -->
    <rect x="248" y="0" width="112" height="150" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="258" y="10" width="92" height="70" rx="3" fill="#f8fafc"/>
    <text x="304" y="50" font-size="24" text-anchor="middle">🌪️</text>
    <text x="258" y="100" fill="#0f172a" font-size="8" font-family="sans-serif" font-weight="bold">فلتر هواء أصلي وكالة</text>
    <text x="258" y="112" fill="#64748b" font-size="7" font-family="sans-serif">نيسان باترول</text>
    <text x="258" y="132" fill="#e41f37" font-size="10" font-family="sans-serif" font-weight="bold">95 ر.س</text>
  </g>
