<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <defs>
    <linearGradient id="bgGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061527"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </linearGradient>
  </defs>
  
  <rect width="500" height="300" rx="16" fill="url(#bgGradHero)"/>
  <rect x="1" y="1" width="498" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Badge -->
  <g transform="translate(150, 24)">
    <rect width="200" height="24" rx="12" fill="#0f2847" stroke="#334155" stroke-width="1"/>
    <text x="100" y="16" fill="#f59e0b" font-family="'Cairo', sans-serif" font-size="10" font-weight="700" text-anchor="middle">المدونة والبحث والاستفسار الفوري</text>
  </g>

  <!-- Title -->
  <text x="250" y="75" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="18" font-weight="900" text-anchor="middle">اعثر على قطعة الغيار المتوافقة بدقة</text>
  <text x="250" y="96" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">مدونة وحلول هيونداي وكيا • استفسار واتساب • بحث مباشر في المتجر</text>

  <!-- 3 Big Launchpad Cards -->
  <g transform="translate(30, 115)">
    <!-- Card 1: Blog & Advice -->
    <g transform="translate(0, 0)">
      <rect width="138" height="155" rx="12" fill="#0a1d33" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="49" y="18" width="40" height="40" rx="10" fill="#f59e0b" opacity="0.15"/>
      <circle cx="69" cy="38" r="9" fill="#f59e0b"/>
      <text x="69" y="78" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">مدونة درة السيارة</text>
      <text x="69" y="96" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="8.5" text-anchor="middle">حلول هيونداي وكيا</text>
      <rect x="24" y="118" width="90" height="22" rx="6" fill="#f59e0b"/>
      <text x="69" y="133" fill="#061527" font-family="'Cairo', sans-serif" font-size="9" font-weight="800" text-anchor="middle">تصفح المدونة</text>
    </g>

    <!-- Card 2: WhatsApp VIN Quote -->
    <g transform="translate(151, 0)">
      <rect width="138" height="155" rx="12" fill="#0a1d33" stroke="#10b981" stroke-width="1.2"/>
      <rect x="49" y="18" width="40" height="40" rx="10" fill="#10b981" opacity="0.15"/>
      <circle cx="69" cy="38" r="9" fill="#34d399"/>
      <text x="69" y="78" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">استفسار واتساب (VIN)</text>
      <text x="69" y="96" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="8.5" text-anchor="middle">تحويل فوري ومباشر</text>
      <rect x="24" y="118" width="90" height="22" rx="6" fill="#10b981"/>
      <text x="69" y="133" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="9" font-weight="800" text-anchor="middle">طلب تسعيرة</text>
    </g>

    <!-- Card 3: Direct Store Search -->
    <g transform="translate(302, 0)">
      <rect width="138" height="155" rx="12" fill="#0a1d33" stroke="#3b82f6" stroke-width="1.2"/>
      <rect x="49" y="18" width="40" height="40" rx="10" fill="#3b82f6" opacity="0.15"/>
      <circle cx="69" cy="38" r="9" fill="#60a5fa"/>
      <text x="69" y="78" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">بحث مباشر في المتجر</text>
      <text x="69" y="96" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="8.5" text-anchor="middle">برقم القطعة أو الاسم</text>
      <rect x="24" y="118" width="90" height="22" rx="6" fill="#3b82f6"/>
      <text x="69" y="133" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="9" font-weight="800" text-anchor="middle">بحث في المتجر</text>
    </g>
  </g>
</svg>