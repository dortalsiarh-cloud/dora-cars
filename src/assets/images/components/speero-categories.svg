<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061527"/>
      <stop offset="100%" stop-color="#0b1e36"/>
    </linearGradient>
  </defs>
  
  <rect width="500" height="280" rx="16" fill="url(#bgGrad5)"/>
  <rect x="1" y="1" width="498" height="278" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="250" y="36" fill="#f59e0b" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" text-anchor="middle">أقسام المتجر المصورة</text>
  <text x="250" y="60" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="17" font-weight="900" text-anchor="middle">تصفح قطع الغيار حسب التصنيف الفني</text>

  <!-- 4 Big Visual Category Cards with Top Icons -->
  <g transform="translate(25, 80)">
    <!-- Cat 1: Compressors -->
    <g transform="translate(0, 0)">
      <rect width="102" height="165" rx="12" fill="#0c2038" stroke="#1e3a5f" stroke-width="1.2"/>
      <rect x="18" y="15" width="66" height="66" rx="12" fill="#061527" stroke="#334155" stroke-width="1"/>
      <circle cx="51" cy="48" r="16" fill="#f59e0b" opacity="0.3"/>
      <text x="51" y="52" fill="#f59e0b" font-size="16" text-anchor="middle">❄️</text>
      <text x="51" y="105" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" text-anchor="middle">الكمبروسر</text>
      <text x="51" y="122" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="8.5" text-anchor="middle">والتبريد</text>
      <rect x="23" y="136" width="56" height="18" rx="5" fill="#1e293b"/>
      <text x="51" y="148" fill="#f59e0b" font-family="'Cairo', sans-serif" font-size="8" font-weight="700" text-anchor="middle">تصفح</text>
    </g>

    <!-- Cat 2: Filters & Oils -->
    <g transform="translate(115, 0)">
      <rect width="102" height="165" rx="12" fill="#0c2038" stroke="#1e3a5f" stroke-width="1.2"/>
      <rect x="18" y="15" width="66" height="66" rx="12" fill="#061527" stroke="#334155" stroke-width="1"/>
      <circle cx="51" cy="48" r="16" fill="#3b82f6" opacity="0.3"/>
      <text x="51" y="52" fill="#60a5fa" font-size="16" text-anchor="middle">🛢️</text>
      <text x="51" y="105" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" text-anchor="middle">فلاتر وزيوت</text>
      <text x="51" y="122" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="8.5" text-anchor="middle">محرك وجيربوكس</text>
      <rect x="23" y="136" width="56" height="18" rx="5" fill="#1e293b"/>
      <text x="51" y="148" fill="#f59e0b" font-family="'Cairo', sans-serif" font-size="8" font-weight="700" text-anchor="middle">تصفح</text>
    </g>

    <!-- Cat 3: Brakes -->
    <g transform="translate(230, 0)">
      <rect width="102" height="165" rx="12" fill="#0c2038" stroke="#1e3a5f" stroke-width="1.2"/>
      <rect x="18" y="15" width="66" height="66" rx="12" fill="#061527" stroke="#334155" stroke-width="1"/>
      <circle cx="51" cy="48" r="16" fill="#ef4444" opacity="0.3"/>
      <text x="51" y="52" fill="#f87171" font-size="16" text-anchor="middle">🛡️</text>
      <text x="51" y="105" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" text-anchor="middle">الفرامل والمكابح</text>
      <text x="51" y="122" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="8.5" text-anchor="middle">أقمشة وهوبات</text>
      <rect x="23" y="136" width="56" height="18" rx="5" fill="#1e293b"/>
      <text x="51" y="148" fill="#f59e0b" font-family="'Cairo', sans-serif" font-size="8" font-weight="700" text-anchor="middle">تصفح</text>
    </g>

    <!-- Cat 4: Suspension -->
    <g transform="translate(345, 0)">
      <rect width="102" height="165" rx="12" fill="#0c2038" stroke="#1e3a5f" stroke-width="1.2"/>
      <rect x="18" y="15" width="66" height="66" rx="12" fill="#061527" stroke="#334155" stroke-width="1"/>
      <circle cx="51" cy="48" r="16" fill="#10b981" opacity="0.3"/>
      <text x="51" y="52" fill="#34d399" font-size="16" text-anchor="middle">🚗</text>
      <text x="51" y="105" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" text-anchor="middle">المساعدات</text>
      <text x="51" y="122" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="8.5" text-anchor="middle">مقصات وتعليق</text>
      <rect x="23" y="136" width="56" height="18" rx="5" fill="#1e293b"/>
      <text x="51" y="148" fill="#f59e0b" font-family="'Cairo', sans-serif" font-size="8" font-weight="700" text-anchor="middle">تصفح</text>
    </g>
  </g>
</svg>